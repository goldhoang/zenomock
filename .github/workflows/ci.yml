name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/zenomock.docs/package-lock.json

      - name: Restore & build API
        run: |
          dotnet restore src/ZenoMock.Api/ZenoMock.Api.csproj
          dotnet build src/ZenoMock.Api/ZenoMock.Api.csproj -c Release --no-restore

      - name: Install & build docs UI
        working-directory: src/zenomock.docs
        env:
          VITE_BASE: /zenomock/
        run: |
          npm ci
          npm run build
